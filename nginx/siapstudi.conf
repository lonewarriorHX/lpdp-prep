# SiapStudi — nginx reverse proxy config (Cloudflare Full Strict)
# Deployed to /root/master/nginx/conf.d/siapstudi.conf by CI/CD
# SSL: Cloudflare Origin CA cert (valid 2026–2041)

# Block direct IP access — only Cloudflare should reach origin
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    return 444;
}

server {
    listen       443 ssl default_server;
    listen       [::]:443 ssl default_server;
    server_name  _;
    ssl_certificate     /etc/certbot/live/siapstudi.com/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/siapstudi.com/privkey.pem;
    return 444;
}

# HTTP → HTTPS redirect (Cloudflare also does this, but belt-and-suspenders)
server {
    listen       80;
    listen       [::]:80;
    server_name  siapstudi.com www.siapstudi.com;
    return 301   https://$host$request_uri;
}

# HTTPS — Cloudflare Origin CA
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  siapstudi.com www.siapstudi.com;

    ssl_certificate     /etc/certbot/live/siapstudi.com/fullchain.pem;
    ssl_certificate_key /etc/certbot/live/siapstudi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # API → Node.js backend
    location /api/ {
        proxy_pass http://siapstudi-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static frontend → nginx container
    location / {
        proxy_pass http://siapstudi-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
