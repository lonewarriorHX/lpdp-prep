# SiapStudi — nginx reverse proxy config
# Copy to /root/master/nginx/conf.d/siapstudi.conf on VPS
# Then: docker exec nginx nginx -s reload

# HTTP → HTTPS redirect (enable after SSL is set up)
# server {
#     listen       80;
#     listen       [::]:80;
#     server_name  siapstudi.com www.siapstudi.com;
#     return 301   https://$host$request_uri;
# }

# For now: HTTP only (IP-based access)
server {
    listen       80;
    server_name  siapstudi.com www.siapstudi.com _;

    # API → Node.js backend
    location /api/ {
        proxy_pass http://siapstudi-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for AI calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static frontend → nginx container
    location / {
        proxy_pass http://siapstudi-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

