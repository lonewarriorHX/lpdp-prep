services:
  siapstudi-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siapstudi
      POSTGRES_USER: siapstudi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siapstudi_secret_2025}
    volumes:
      - siapstudi_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siapstudi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  siapstudi-api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://siapstudi:${DB_PASSWORD:-siapstudi_secret_2025}@shared-db:5432/siapstudi
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_2025}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      MIDTRANS_NOTIFICATION_URL: ${MIDTRANS_NOTIFICATION_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - nginx-network
      - shared-db-net

  siapstudi-web:
    build: .
    restart: unless-stopped
    depends_on:
      siapstudi-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - nginx-network

volumes:
  siapstudi_pgdata:

networks:
  internal:
    driver: bridge
  nginx-network:
    external: true
    name: compose_nginx-network
  shared-db-net:
    external: true
    name: shared-db-net
